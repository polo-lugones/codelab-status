<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado — Robtec CodeLab</title>
  <meta name="description" content="Estado operativo de Robtec CodeLab: plataforma, API y base de datos." />
  <style>
    :root { --bg: #0b1220; --panel: #111a2e; --line: #24314d; --fg: #eef2ff; --muted: #93a3c0; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    main { width: min(720px, calc(100vw - 32px)); margin: 0 auto; padding: 48px 0 24px; flex: 1; }
    h1 { font-size: 26px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    .sub { color: var(--muted); margin: 0 0 26px; font-size: 14px; }
    .overall { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; font-size: 18px; font-weight: 600; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 12px rgba(34, 197, 94, .6); }
    .dot.bad { background: var(--bad); box-shadow: 0 0 12px rgba(239, 68, 68, .6); }
    .svc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; }
    .svc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .svc-name { font-weight: 600; }
    .svc-state { margin-left: auto; font-size: 13.5px; color: var(--muted); }
    .bars { display: flex; gap: 2px; height: 26px; align-items: stretch; }
    .bar { flex: 1; border-radius: 2px; background: #1d2a45; min-width: 3px; }
    .bar.ok { background: var(--ok); opacity: .82; }
    .bar.bad { background: var(--bad); }
    .bars-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: 6px; }
    .updated { color: var(--muted); font-size: 13px; text-align: center; margin-top: 22px; }
    footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 18px 0 26px; }
    footer a { color: #8ea2ff; text-decoration: none; }
    .err { background: var(--panel); border: 1px solid var(--warn); border-radius: 12px; padding: 14px 18px; color: var(--muted); }
    .notice { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; border: 1px solid; }
    .notice .n-ic { font-size: 20px; }
    .notice .n-body strong { display: block; margin-bottom: 2px; }
    .notice .n-since { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .notice.maintenance, .notice.info { background: rgba(245, 158, 11, .08); border-color: var(--warn); }
    .notice.incident { background: rgba(239, 68, 68, .1); border-color: var(--bad); }
    @media (prefers-color-scheme: light) { :root { --bg: #f4f6fb; --panel: #ffffff; --line: #dde3f0; --fg: #101828; --muted: #5b6b85; } .bar { background: #e3e9f5; } }
  </style>
</head>
<body>
  <main>
    <h1>🤖 Robtec CodeLab — Estado</h1>
    <p class="sub">Monitoreo automático desde infraestructura independiente. Se actualiza cada 30 minutos.</p>
    <div id="notice"></div>
    <div class="overall"><span class="dot" id="overall-dot"></span><span id="overall-text">Cargando estado…</span></div>
    <div id="services"></div>
    <p class="updated" id="updated"></p>
  </main>
  <footer>Los checks corren en GitHub Actions, fuera del hosting de la plataforma. · <a href="https://codelab.robtec.dev">codelab.robtec.dev</a></footer>
  <script>
    const NOMBRES = { front: "Plataforma (codelab.robtec.dev)", api: "API (api-codelab.robtec.dev)", db: "Base de datos" };
    function pinta(d) {
      const nd = document.getElementById("notice");
      if (d.notice && d.notice.message) {
        const ICONO = { maintenance: "🛠️", incident: "🚨", info: "ℹ️" };
        const TITULO = { maintenance: "Mantenimiento programado", incident: "Incidente en curso", info: "Aviso" };
        const desde = new Date(d.notice.since).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        nd.innerHTML = `<div class="notice ${d.notice.type}"><span class="n-ic">${ICONO[d.notice.type] || "ℹ️"}</span><div class="n-body"><strong>${TITULO[d.notice.type] || "Aviso"}</strong><span></span><div class="n-since">Publicado el ${desde}</div></div></div>`;
        nd.querySelector(".n-body span").textContent = d.notice.message;
      } else {
        nd.innerHTML = "";
      }
      const servicios = d.checks || [];
      const todoOk = servicios.every((s) => s.ok);
      const dot = document.getElementById("overall-dot");
      dot.className = "dot " + (todoOk ? "ok" : "bad");
      document.getElementById("overall-text").textContent = todoOk ? "Todos los sistemas operativos" : "Hay servicios con problemas";
      const cont = document.getElementById("services");
      cont.innerHTML = "";
      for (const s of servicios) {
        const hist = (d.history || []).map((h) => (h.checks.find((x) => x.name === s.name) || {}).ok);
        const barras = hist.map((ok) => `<span class="bar ${ok === true ? "ok" : ok === false ? "bad" : ""}" ></span>`).join("");
        const upPct = hist.length ? Math.round((hist.filter(Boolean).length / hist.length) * 1000) / 10 : null;
        const div = document.createElement("div");
        div.className = "svc";
        div.innerHTML = `
          <div class="svc-head">
            <span class="dot ${s.ok ? "ok" : "bad"}"></span>
            <span class="svc-name">${NOMBRES[s.name] || s.name}</span>
            <span class="svc-state">${s.ok ? "Operativo" : "Con problemas"}${s.ms ? " · " + s.ms + " ms" : ""}</span>
          </div>
          <div class="bars">${barras}</div>
          <div class="bars-label"><span>hace 24 h</span><span>${upPct !== null ? upPct + "% uptime" : ""}</span><span>ahora</span></div>`;
        cont.appendChild(div);
      }
      const fecha = new Date(d.updated);
      const min = Math.round((Date.now() - fecha.getTime()) / 60000);
      document.getElementById("updated").textContent = `Última verificación: ${fecha.toLocaleString("es-AR")} (hace ${min} min)`;
    }
    function carga() {
      fetch("status.json?t=" + Date.now())
        .then((r) => r.json())
        .then(pinta)
        .catch(() => {
          document.getElementById("overall-text").textContent = "No se pudo cargar el estado.";
          document.getElementById("services").innerHTML = '<div class="err">Sin datos todavía. Si esto persiste, el monitoreo está en pausa — la plataforma puede estar perfectamente operativa.</div>';
        });
    }
    carga();
    setInterval(carga, 60000);
  </script>
</body>
</html>
